<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900"
     font-family="'Times New Roman', 'Noto Sans CJK SC', 'SimHei', serif">

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6B7280"/>
    </marker>
  </defs>

  <text x="800" y="55" text-anchor="middle" font-size="26" font-weight="bold" fill="#1F2937">
    数据结构分类
  </text>
  <text x="800" y="82" text-anchor="middle" font-size="14" fill="#6B7280" font-style="italic">
    按存储方式与逻辑关系划分的主要数据结构类型
  </text>

  <!-- ===== ROOT ===== -->
  <g>
    <rect x="640" y="120" width="320" height="80" rx="10"
          fill="#B197D6" stroke="#8B6CB8" stroke-width="2"/>
    <text x="800" y="155" text-anchor="middle" font-size="18" font-weight="bold" fill="#FFFFFF">
      数据结构
    </text>
    <text x="800" y="180" text-anchor="middle" font-size="12" fill="#FFFFFF">
      (Data Structures)
    </text>
  </g>

  <line x1="800" y1="200" x2="800" y2="240" stroke="#6B7280" stroke-width="2"/>
  <line x1="250" y1="240" x2="1350" y2="240" stroke="#6B7280" stroke-width="2"/>

  <!-- ===== MID LEVEL ===== -->
  <g>
    <line x1="250" y1="240" x2="250" y2="290" stroke="#6B7280" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="100" y="295" width="300" height="80" rx="10"
          fill="#7BA7D9" stroke="#5687C2" stroke-width="2"/>
    <text x="250" y="328" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">
      线性结构
    </text>
    <text x="250" y="353" text-anchor="middle" font-size="12" fill="#FFFFFF">
      元素一对一关系
    </text>
  </g>

  <g>
    <line x1="800" y1="240" x2="800" y2="290" stroke="#6B7280" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="650" y="295" width="300" height="80" rx="10"
          fill="#7BA7D9" stroke="#5687C2" stroke-width="2"/>
    <text x="800" y="328" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">
      树形结构
    </text>
    <text x="800" y="353" text-anchor="middle" font-size="12" fill="#FFFFFF">
      元素一对多关系
    </text>
  </g>

  <g>
    <line x1="1350" y1="240" x2="1350" y2="290" stroke="#6B7280" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="1200" y="295" width="300" height="80" rx="10"
          fill="#7BA7D9" stroke="#5687C2" stroke-width="2"/>
    <text x="1350" y="328" text-anchor="middle" font-size="17" font-weight="bold" fill="#FFFFFF">
      图形结构
    </text>
    <text x="1350" y="353" text-anchor="middle" font-size="12" fill="#FFFFFF">
      元素多对多关系
    </text>
  </g>

  <!-- ===== LEAVES ===== -->
  <!-- 线性结构 -->
  <line x1="250" y1="375" x2="250" y2="420" stroke="#6B7280" stroke-width="2"/>
  <line x1="125" y1="420" x2="395" y2="420" stroke="#6B7280" stroke-width="2"/>
  <g>
    <line x1="135" y1="420" x2="135" y2="460" stroke="#6B7280" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="55" y="465" width="160" height="90" rx="8"
          fill="#D6EBD6" stroke="#88C088" stroke-width="1.8"/>
    <text x="135" y="498" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">数组</text>
    <text x="135" y="518" text-anchor="middle" font-size="11" fill="#4B5563">Array</text>
    <text x="135" y="538" text-anchor="middle" font-size="11" fill="#4B5563">连续内存，随机访问</text>
  </g>
  <g>
    <line x1="255" y1="420" x2="255" y2="460" stroke="#6B7280" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="245" y="465" width="160" height="90" rx="8"
          fill="#D6EBD6" stroke="#88C088" stroke-width="1.8"/>
    <text x="325" y="498" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">链表</text>
    <text x="325" y="518" text-anchor="middle" font-size="11" fill="#4B5563">Linked List</text>
    <text x="325" y="538" text-anchor="middle" font-size="11" fill="#4B5563">动态增删，非连续</text>
  </g>
  <g>
    <line x1="385" y1="420" x2="385" y2="460" stroke="#6B7280" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="415" y="465" width="160" height="90" rx="8"
          fill="#D6EBD6" stroke="#88C088" stroke-width="1.8"/>
    <text x="495" y="498" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">栈 / 队列</text>
    <text x="495" y="518" text-anchor="middle" font-size="11" fill="#4B5563">Stack / Queue</text>
    <text x="495" y="538" text-anchor="middle" font-size="11" fill="#4B5563">LIFO / FIFO 约束</text>
  </g>

  <!-- 树形结构 -->
  <line x1="800" y1="375" x2="800" y2="420" stroke="#6B7280" stroke-width="2"/>
  <line x1="650" y1="420" x2="950" y2="420" stroke="#6B7280" stroke-width="2"/>
  <g>
    <line x1="670" y1="420" x2="670" y2="460" stroke="#6B7280" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="590" y="465" width="160" height="90" rx="8"
          fill="#D6EBD6" stroke="#88C088" stroke-width="1.8"/>
    <text x="670" y="498" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">二叉树</text>
    <text x="670" y="518" text-anchor="middle" font-size="11" fill="#4B5563">Binary Tree</text>
    <text x="670" y="538" text-anchor="middle" font-size="11" fill="#4B5563">BST, AVL, 堆</text>
  </g>
  <g>
    <line x1="800" y1="420" x2="800" y2="460" stroke="#6B7280" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="720" y="465" width="160" height="90" rx="8"
          fill="#D6EBD6" stroke="#88C088" stroke-width="1.8"/>
    <text x="800" y="498" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">多叉树</text>
    <text x="800" y="518" text-anchor="middle" font-size="11" fill="#4B5563">N-ary Tree</text>
    <text x="800" y="538" text-anchor="middle" font-size="11" fill="#4B5563">B树, Trie, 哈夫曼</text>
  </g>
  <g>
    <line x1="930" y1="420" x2="930" y2="460" stroke="#6B7280" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="850" y="465" width="160" height="90" rx="8"
          fill="#D6EBD6" stroke="#88C088" stroke-width="1.8"/>
    <text x="930" y="498" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">并查集</text>
    <text x="930" y="518" text-anchor="middle" font-size="11" fill="#4B5563">Union-Find</text>
    <text x="930" y="538" text-anchor="middle" font-size="11" fill="#4B5563">等价类划分</text>
  </g>

  <!-- 图形结构 -->
  <line x1="1350" y1="375" x2="1350" y2="420" stroke="#6B7280" stroke-width="2"/>
  <line x1="1230" y1="420" x2="1470" y2="420" stroke="#6B7280" stroke-width="2"/>
  <g>
    <line x1="1250" y1="420" x2="1250" y2="460" stroke="#6B7280" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="1170" y="465" width="160" height="90" rx="8"
          fill="#D6EBD6" stroke="#88C088" stroke-width="1.8"/>
    <text x="1250" y="498" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">有向图</text>
    <text x="1250" y="518" text-anchor="middle" font-size="11" fill="#4B5563">Directed Graph</text>
    <text x="1250" y="538" text-anchor="middle" font-size="11" fill="#4B5563">DAG, 拓扑排序</text>
  </g>
  <g>
    <line x1="1450" y1="420" x2="1450" y2="460" stroke="#6B7280" stroke-width="2"
          marker-end="url(#arrow)"/>
    <rect x="1370" y="465" width="160" height="90" rx="8"
          fill="#D6EBD6" stroke="#88C088" stroke-width="1.8"/>
    <text x="1450" y="498" text-anchor="middle" font-size="14" font-weight="600" fill="#1F2937">无向图</text>
    <text x="1450" y="518" text-anchor="middle" font-size="11" fill="#4B5563">Undirected Graph</text>
    <text x="1450" y="538" text-anchor="middle" font-size="11" fill="#4B5563">MST, 最短路径</text>
  </g>

  <!-- ===== LEGEND ===== -->
  <g>
    <rect x="500" y="700" width="600" height="120" rx="10"
          fill="#FFFFFF" stroke="#D1D5DB" stroke-width="1.5"/>
    <text x="800" y="730" text-anchor="middle" font-size="15" font-weight="bold" fill="#1F2937">
      颜色说明
    </text>

    <rect x="540" y="750" width="22" height="22" rx="4" fill="#B197D6"/>
    <text x="572" y="767" font-size="13" fill="#1F2937">根概念</text>

    <rect x="720" y="750" width="22" height="22" rx="4" fill="#7BA7D9"/>
    <text x="752" y="767" font-size="13" fill="#1F2937">大类 / 分支</text>

    <rect x="920" y="750" width="22" height="22" rx="4" fill="#88C088"/>
    <text x="952" y="767" font-size="13" fill="#1F2937">具体数据结构</text>

    <text x="800" y="800" text-anchor="middle" font-size="12" fill="#6B7280" font-style="italic">
      按存储方式与逻辑关系划分，此处仅列出主要类型
    </text>
  </g>
</svg>